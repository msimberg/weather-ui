[package]
name = "weather-ui"
version = "0.1.0"
edition = "2021"
description = "Weather dashboard with a fisheye time axis, backed by Pirate Weather"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "rustls-tls-webpki-roots",
] }
tower-http = { version = "0.7", features = [
  "fs",
  "compression-gzip",
  "compression-br",
  "trace",
  "set-header",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
