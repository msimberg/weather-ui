name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust fmt+clippy+test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # clippy is installed automatically by rustup; the toolchain is
      # whatever stable is current on the runner, matching local builds.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: frontend lint+types+test+build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx biome ci .

      - name: tsc + vitest + vite build (vitest must run pre-build checks)
        run: npm run test && npm run check && npm run build

  docker:
    name: docker build (smoke, no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Build-only; if this passes, a push of the same Dockerfile will too.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
