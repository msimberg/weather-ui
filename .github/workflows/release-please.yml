name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Manifest mode: defaults from release-please-config.json and
          # .release-please-manifest.json; no extra options needed.
          token: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN-cascaded tags do not re-trigger push workflows, so the
  # release workflow is called explicitly with the tag release-please made.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

