<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Weather timeline with a detail gradient around now"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>weather-ui</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      (() => {
        var stored = null;
        try {
          stored = localStorage.getItem("wu.settings");
        } catch (_e) {}
        var theme = "auto";
        if (stored) {
          try {
            theme = JSON.parse(stored).theme || "auto";
          } catch (_e) {}
        }
        if (theme === "auto") {
          theme = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
